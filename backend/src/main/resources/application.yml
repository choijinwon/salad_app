spring:
  application:
    name: salad-delivery-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/salad_app}
    username: ${DATABASE_USERNAME:salad_app}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

naver:
  api:
    enabled: ${NAVER_API_ENABLED:false}
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    account-id: ${NAVER_ACCOUNT_ID:}
    base-url: ${NAVER_API_BASE_URL:https://api.commerce.naver.com}
