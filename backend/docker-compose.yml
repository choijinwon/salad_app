services:
  postgres:
    image: postgres:16
    container_name: salad-app-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-salad_app}
      POSTGRES_USER: ${DATABASE_USERNAME:-salad_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - salad_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salad_app -d salad_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  salad_postgres_data:
